[workspace]
members = ["crates/rit-core", "crates/rit-cli", "crates/rit-git", "crates/rit-storage", "crates/rit-application"]
resolver = "2"

[workspace.package]
version = "0.1.0-dev.1"
edition = "2024"
rust-version = "1.99.1"
license = "UNLICENSED"

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.17"
toml = "0.9.8"
