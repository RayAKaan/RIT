name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Test all features without stopping at first failed target
        run: cargo test --locked --workspace --all-targets --all-features --no-fail-fast
      - name: Hot-journal recovery acceptance (Linux)
        if: ${{ always() && matrix.os == 'ubuntu-latest' }}
        run: cargo test --locked -p rit-storage --test crash_recovery marked_registry_recovers_hot_journal_after_killed_writer -- --nocapture
      - name: Database substitution acceptance (Linux)
        if: ${{ always() && matrix.os == 'ubuntu-latest' }}
        run: cargo test --locked -p rit-storage --test registry refuses_replaced_marked_database_even_if_schema_and_application_id_match -- --nocapture
      - name: Build
        id: build
        if: ${{ always() }}
        run: cargo build --locked --workspace --all-features
      - name: Release build
        if: ${{ always() }}
        run: cargo build --locked --workspace --all-features --release
      - name: Documentation
        if: ${{ always() }}
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --all-features --no-deps
      - name: Python scoped stdio interoperability (Linux)
        if: ${{ always() && matrix.os == 'ubuntu-latest' && steps.build.outcome == 'success' }}
        env:
          RIT_PROTOCOL_BINARY: ${{ github.workspace }}/target/debug/rit-protocol
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 sdk/python/test_interop.py
