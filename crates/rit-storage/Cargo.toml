[package]
name = "rit-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
[dependencies]
getrandom = "0.4.3"
rit-core = { path = "../rit-core" }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { workspace = true, features = ["derive"] }
serde_json = "1.0.154"
thiserror.workspace = true
uuid = { version = "1.29.1", features = ["v4"] }
[dev-dependencies]
tempfile = "3.24.0"
[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1.6", features = ["fs", "process"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Memory", "Win32_System_SystemServices", "Win32_System_Threading"] }
