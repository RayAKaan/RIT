[package]
name = "rit-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "rit"
path = "src/main.rs"

[dependencies]
rit-core = { path = "../rit-core" }
clap = { version = "4.5.54", features = ["derive"] }
serde = { workspace = true }
serde_json = "1.0.145"
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.22", default-features = false, features = ["fmt", "json", "std"] }

[dev-dependencies]
tempfile = "3.24.0"
